version: 2
name: sciobraille_v2_master
description: Full training and validation of Sciobraille V2 candidates on Master V2 dataset.

paths:
  data: sciobraille-model-lab/datasets/master_v2/data.yaml
  benchmark: sciobraille-model-lab/benchmark/ground_truth.csv
  inference_config: sciobraille-model-lab/configs/v1_optimized.yaml
  output_root: sciobraille-model-lab/models/v2_master

candidates:
  candidate_a:
    name: yolov8s_master_v2
    arch: YOLOv8s
    initialization: sciobraille-scanner/backend/model/best.pt
    experiment_dir: sciobraille-model-lab/models/v2_master/experiments/yolov8s
  candidate_b:
    name: yolo11s_master_v2
    arch: YOLO11s
    initialization: yolo11s.pt
    experiment_dir: sciobraille-model-lab/models/v2_master/experiments/yolo11s

training:
  epochs: 30
  patience: 7
  batch: 8
  imgsz: 640
  device: '0'
  workers: 2
  optimizer: AdamW
  lr0: 0.0005
  lrf: 0.1
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 2.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.01
  seed: 20260923
  deterministic: true
  amp: true
  cache: false
  save_period: 5
  close_mosaic: 5

geometric_augmentations:
  degrees: 3.0
  translate: 0.03
  scale: 0.12
  shear: 0.0
  perspective: 0.0002
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.10
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0

photometric_augmentations:
  probability: 0.35
  brightness_limit: 0.10
  contrast_limit: 0.12
  gamma_min: 0.92
  gamma_max: 1.08
  blur_probability: 0.08
  noise_probability: 0.10
  noise_sigma: 0.012
  shadow_probability: 0.10
  shadow_strength_min: 0.08
  shadow_strength_max: 0.22
  hsv_h: 0.0
  hsv_s: 0.05
  hsv_v: 0.12

evaluation:
  validation_confidence: 0.001
  validation_iou: 0.70
  text_repeat: 3
  selection_priority:
    - map50_95
    - map50
    - recall
    - precision
    - latency

safety:
  production_model_path: sciobraille-scanner/backend/model/best.pt
  expected_production_sha256: b9269091c92be04c461596d8c2254e593864c7bce02c1b2a439837a7cc99f974
  allow_horizontal_flip: false
  allow_vertical_flip: false
  allow_pattern_changing_transforms: false
