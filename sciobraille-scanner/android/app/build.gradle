plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.sciobraille.scanner'
    compileSdk 36

    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def secureProperty = { String name ->
        project.findProperty(name) ?: localProps.getProperty(name) ?: System.getenv(name)
    }

    def configuredBackendUrl = secureProperty('SCIOBRAILLE_BACKEND_URL')
            ?: 'https://replace-with-your-sciobraille-backend.example.com'
    def configuredDebugBackendUrl = secureProperty('SCIOBRAILLE_DEBUG_BACKEND_URL')
            ?: configuredBackendUrl
    def configuredV2BackendUrl = secureProperty('SCIOBRAILLE_V2_BACKEND_URL')
            ?: 'http://192.168.1.7:8089'
    def configuredDuplicateIou = secureProperty('SCIOBRAILLE_DUPLICATE_IOU')
            ?: '0.70'
    def releaseStoreFile = secureProperty('SCIOBRAILLE_UPLOAD_STORE_FILE')
    def releaseStorePassword = secureProperty('SCIOBRAILLE_UPLOAD_STORE_PASSWORD')
    def releaseKeyAlias = secureProperty('SCIOBRAILLE_UPLOAD_KEY_ALIAS')
    def releaseKeyPassword = secureProperty('SCIOBRAILLE_UPLOAD_KEY_PASSWORD')
    def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists() &&
            releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    defaultConfig {
        applicationId 'com.sciobraille.scanner'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '1.2.1-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SCIOBRAILLE_BACKEND_URL', "\"${configuredBackendUrl}\""
        buildConfigField 'String', 'OFFLINE_MODEL_ASSET', '"best_int8.tflite"'
        buildConfigField 'String', 'APP_TITLE_LABEL', '"SCIOBRAILLE"'
        buildConfigField 'float', 'DUPLICATE_IOU_THRESHOLD', '0.70f'
        manifestPlaceholders = [
            usesCleartextTraffic: 'false',
            appLabel: 'SCIOBRAILLE'
        ]
    }

    signingConfigs {
        upload {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Keep CI/development signing separate from an installed production app.
            applicationIdSuffix '.dev'
            buildConfigField 'String', 'SCIOBRAILLE_BACKEND_URL', "\"${configuredDebugBackendUrl}\""
            buildConfigField 'String', 'OFFLINE_MODEL_ASSET', '"best_int8.tflite"'
            buildConfigField 'String', 'APP_TITLE_LABEL', '"SCIOBRAILLE"'
            buildConfigField 'float', 'DUPLICATE_IOU_THRESHOLD', '0.70f'
            manifestPlaceholders = [
                usesCleartextTraffic: 'true',
                appLabel: 'SCIOBRAILLE Dev'
            ]
        }
        v2Test {
            initWith debug
            applicationIdSuffix ".v2test"
            versionNameSuffix "-v2test"
            buildConfigField 'String', 'SCIOBRAILLE_BACKEND_URL', "\"${configuredV2BackendUrl}\""
            buildConfigField 'String', 'OFFLINE_MODEL_ASSET', '"best_v2_int8.tflite"'
            buildConfigField 'String', 'APP_TITLE_LABEL', '"ScioBraille V2 Test"'
            buildConfigField 'float', 'DUPLICATE_IOU_THRESHOLD', "${configuredDuplicateIou}f"
            manifestPlaceholders = [
                usesCleartextTraffic: 'true',
                appLabel: 'Sciobraille V2 Test'
            ]
            matchingFallbacks = ['debug']
        }
        release {
            buildConfigField 'String', 'SCIOBRAILLE_BACKEND_URL', "\"${configuredBackendUrl}\""
            buildConfigField 'String', 'OFFLINE_MODEL_ASSET', '"best_int8.tflite"'
            buildConfigField 'String', 'APP_TITLE_LABEL', '"SCIOBRAILLE"'
            buildConfigField 'float', 'DUPLICATE_IOU_THRESHOLD', '0.70f'
            manifestPlaceholders = [
                usesCleartextTraffic: 'false',
                appLabel: 'SCIOBRAILLE'
            ]
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.upload
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    testOptions { unitTests.includeAndroidResources = true }

    androidResources { noCompress += ['tflite'] }

    sourceSets {
        v2Test.assets.srcDir 'src/v2Test/assets'
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskRequested = taskGraph.allTasks.any {
        it.name in ['bundleRelease', 'assembleRelease', 'packageReleaseBundle']
    }
    if (releaseTaskRequested && !android.signingConfigs.upload.storeFile) {
        throw new GradleException(
                'Release signing is not configured. Set SCIOBRAILLE_UPLOAD_STORE_FILE, ' +
                        'SCIOBRAILLE_UPLOAD_STORE_PASSWORD, SCIOBRAILLE_UPLOAD_KEY_ALIAS, and ' +
                        'SCIOBRAILLE_UPLOAD_KEY_PASSWORD in local.properties, gradle.properties, or CI env.'
        )
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.activity:activity-ktx:1.12.4'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    ksp 'androidx.room:room-compiler:2.8.4'

    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
