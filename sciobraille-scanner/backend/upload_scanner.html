<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScioBraille Image Scanner</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #fbfaf9;
      --ink: #201f24;
      --muted: #64616a;
      --line: #d4d0d8;
      --primary: #6257c8;
      --primary-dark: #443aa4;
      --success: #176b46;
      --error: #a92828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }
    header strong { font-size: 24px; }
    header span { color: var(--muted); margin-left: 12px; }
    main {
      width: min(1100px, calc(100% - 32px));
      margin: 28px auto 48px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    input[type="file"] {
      min-height: 48px;
      max-width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      background: white;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      font-weight: 600;
    }
    input[type="checkbox"] { width: 22px; height: 22px; }
    button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.55; cursor: wait; }
    #status {
      min-height: 24px;
      margin: 16px 0;
      color: var(--muted);
      font-weight: 600;
    }
    #status.success { color: var(--success); }
    #status.error { color: var(--error); }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 8px; font-weight: 700; }
    img, canvas {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #171717;
      border: 1px solid var(--line);
    }
    .results {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }
    .metrics { color: var(--muted); margin-bottom: 12px; }
    pre {
      min-height: 110px;
      margin: 0;
      padding: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      background: white;
      border: 1px solid var(--line);
      font: 20px/1.5 ui-monospace, "Cascadia Mono", monospace;
    }
    details { margin-top: 14px; }
    @media (max-width: 760px) {
      header span { display: block; margin: 4px 0 0; }
      .preview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>ScioBraille</strong><span>PC image scanner</span>
  </header>
  <main>
    <div class="controls">
      <input id="imageFile" type="file" accept="image/*" aria-label="Choose a Braille image">
      <label><input id="flipImage" type="checkbox" checked> Flip horizontally before scanning</label>
      <button id="scanButton" type="button" disabled>Scan image</button>
    </div>

    <p id="status" role="status" aria-live="polite">Checking backend...</p>

    <div class="preview-grid">
      <figure>
        <figcaption>Selected image</figcaption>
        <img id="originalPreview" alt="Selected Braille image preview">
      </figure>
      <figure>
        <figcaption>Image sent to model</figcaption>
        <canvas id="modelPreview" aria-label="Horizontally flipped image sent to the model"></canvas>
      </figure>
    </div>

    <section class="results" aria-labelledby="resultTitle">
      <h1 id="resultTitle">English output</h1>
      <div id="metrics" class="metrics">No result yet.</div>
      <pre id="rawOutput" aria-label="Raw English model output">Choose an image and press Scan image.</pre>
      <details>
        <summary>Corrected text</summary>
        <pre id="correctedOutput" aria-label="Language-corrected English output"></pre>
      </details>
    </section>

    <figure id="annotatedSection" hidden style="margin-top: 24px">
      <figcaption>Model detections</figcaption>
      <img id="annotatedImage" alt="Braille image with detected cells and labels">
    </figure>
  </main>

  <script>
    const fileInput = document.getElementById('imageFile');
    const flipInput = document.getElementById('flipImage');
    const scanButton = document.getElementById('scanButton');
    const statusText = document.getElementById('status');
    const originalPreview = document.getElementById('originalPreview');
    const canvas = document.getElementById('modelPreview');
    const rawOutput = document.getElementById('rawOutput');
    const correctedOutput = document.getElementById('correctedOutput');
    const metrics = document.getElementById('metrics');
    const annotatedSection = document.getElementById('annotatedSection');
    const annotatedImage = document.getElementById('annotatedImage');
    let selectedFile = null;
    let selectedBitmap = null;
    let previewUrl = null;

    function setStatus(message, kind = '') {
      statusText.textContent = message;
      statusText.className = kind;
    }

    function renderModelInput() {
      if (!selectedBitmap) return;
      const maxEdge = 2200;
      const scale = Math.min(1, maxEdge / Math.max(selectedBitmap.width, selectedBitmap.height));
      canvas.width = Math.max(1, Math.round(selectedBitmap.width * scale));
      canvas.height = Math.max(1, Math.round(selectedBitmap.height * scale));
      const context = canvas.getContext('2d', { alpha: false });
      context.save();
      if (flipInput.checked) {
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
      }
      context.drawImage(selectedBitmap, 0, 0, canvas.width, canvas.height);
      context.restore();
    }

    function canvasBlob() {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not prepare image')), 'image/jpeg', 0.90);
      });
    }

    fileInput.addEventListener('change', async () => {
      selectedFile = fileInput.files && fileInput.files[0];
      scanButton.disabled = true;
      annotatedSection.hidden = true;
      if (!selectedFile) return;
      try {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(selectedFile);
        originalPreview.src = previewUrl;
        if (selectedBitmap) selectedBitmap.close();
        selectedBitmap = await createImageBitmap(selectedFile);
        renderModelInput();
        scanButton.disabled = false;
        setStatus('Image ready. The preview on the right is exactly what the model will receive.', 'success');
      } catch (error) {
        setStatus(error.message || 'Could not open the selected image.', 'error');
      }
    });

    flipInput.addEventListener('change', renderModelInput);

    scanButton.addEventListener('click', async () => {
      if (!selectedFile || !selectedBitmap) return;
      scanButton.disabled = true;
      rawOutput.textContent = 'Scanning...';
      correctedOutput.textContent = '';
      metrics.textContent = 'Model running...';
      annotatedSection.hidden = true;
      setStatus('Uploading the prepared image to the V2 backend model...');
      try {
        renderModelInput();
        const blob = await canvasBlob();
        const form = new FormData();
        form.append('frame', blob, 'sciobraille-input.jpg');
        const response = await fetch('/api/scan-frame?flip_horizontal=false&include_image=true', {
          method: 'POST',
          body: form
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.detail || 'The backend rejected the image.');
        rawOutput.textContent = payload.raw_text || '(No Braille detected)';
        correctedOutput.textContent = payload.corrected_text || '(No corrected text)';
        metrics.textContent = `${payload.detections} cells | ${Math.round(payload.confidence * 100)}% mean confidence | raw model output`;
        if (payload.annotated_image) {
          annotatedImage.src = `data:image/jpeg;base64,${payload.annotated_image}`;
          annotatedSection.hidden = false;
        }
        setStatus(payload.detections ? 'Scan complete.' : 'No Braille cells were detected.', payload.detections ? 'success' : 'error');
      } catch (error) {
        rawOutput.textContent = '(Scan failed)';
        metrics.textContent = 'No result.';
        setStatus(error.message || 'Could not reach the backend.', 'error');
      } finally {
        scanButton.disabled = false;
      }
    });

    fetch('/api/health')
      .then(response => response.json())
      .then(payload => setStatus(`Backend ready. ${payload.classes} classes loaded.`, 'success'))
      .catch(() => setStatus('Backend is unavailable. Start it and reload this page.', 'error'));
  </script>
</body>
</html>
