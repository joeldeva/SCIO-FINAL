name: SCIOBRAILLE build and verification
on:
  push:
    branches: [main]
    paths: ['sciobraille-scanner/**', '.github/workflows/scanner-quality.yml']
  pull_request:
    paths: ['sciobraille-scanner/**', '.github/workflows/scanner-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the real Android model
        run: |
          git lfs pull --include='sciobraille-scanner/android/app/src/main/assets/best_int8.tflite,sciobraille-model-lab/benchmark/images/test_sciobraille.jpeg'
          mkdir -p sciobraille-scanner/android/app/src/androidTest/assets
          cp sciobraille-model-lab/benchmark/images/test_sciobraille.jpeg sciobraille-scanner/android/app/src/androidTest/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test, lint, and package
        working-directory: sciobraille-scanner/android
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK signature and record checksum
        working-directory: sciobraille-scanner/android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/reports/apk-sha256.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android inference, PDF and installed translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd sciobraille-scanner/android && bash gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest
            adb exec-out run-as com.sciobraille.scanner cat files/offline-device-smoke.json > sciobraille-scanner/android/app/build/reports/offline-device-smoke.json
            adb exec-out run-as com.sciobraille.scanner cat files/certificate-device-test.pdf > sciobraille-scanner/android/app/build/reports/certificate-device-test.pdf
            adb exec-out run-as com.sciobraille.scanner cat files/installed-translation-smoke.json > sciobraille-scanner/android/app/build/reports/installed-translation-smoke.json
      - name: Validate collected native reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('sciobraille-scanner/android/app/build/reports')
          json.loads((root/'offline-device-smoke.json').read_text())
          json.loads((root/'installed-translation-smoke.json').read_text())
          assert (root/'certificate-device-test.pdf').read_bytes().startswith(b'%PDF')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCIOBRAILLE-Android-debug-and-reports
          path: |
            sciobraille-scanner/android/app/build/outputs/apk/debug/*.apk
            sciobraille-scanner/android/app/build/reports/
            sciobraille-scanner/android/app/build/test-results/
            sciobraille-scanner/android/app/build/outputs/androidTest-results/
          retention-days: 30
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch model and regression photographs
        run: git lfs pull --include='sciobraille-scanner/backend/model/best.pt,sciobraille-model-lab/benchmark/images/*,DMI.jpeg,Flipped DMI.jpeg'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sciobraille-scanner/backend/requirements-runtime.txt
      - name: Install CPU inference and test dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r sciobraille-scanner/backend/requirements-runtime.txt
          pip install pytest
      - name: Backend contracts and provider failures
        working-directory: sciobraille-scanner/backend
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Real physical-image regression (reports accuracy without a fabricated pass threshold)
        run: python sciobraille-scanner/backend/scripts/evaluate_physical.py --output physical-regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCIOBRAILLE-backend-reports
          path: |
            sciobraille-scanner/backend/test-results.xml
            physical-regression.json
          retention-days: 30
